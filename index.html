<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SASE World</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2563eb;
      --card: #ffffff;
      --border: #e5e5e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #ededed;
        --muted: #9a9a9a;
        --accent: #60a5fa;
        --card: #1c1c1c;
        --border: #2c2c2c;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header, main, footer {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      padding-bottom: 24px;
    }
    .logo { font-weight: 700; font-size: 1.25rem; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 20px;
    }
    nav a:hover { color: var(--fg); }
    main { flex: 1; }
    .hero { padding: 64px 0 48px; }
    .hero h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.15;
      margin-bottom: 16px;
    }
    .hero p { color: var(--muted); font-size: 1.125rem; max-width: 560px; }
    .btn {
      display: inline-block;
      margin-top: 28px;
      padding: 12px 24px;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      padding-bottom: 64px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }
    .card h2 { font-size: 1.125rem; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: 0.95rem; }
    footer {
      padding-top: 24px;
      padding-bottom: 24px;
      color: var(--muted);
      font-size: 0.875rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">SASE World</div>
    <nav>
      <a href="#about">소개</a>
      <a href="#contact">문의</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>SASE World에 오신 것을 환영합니다</h1>
      <p>이곳에 사이트를 소개하는 문구를 작성하세요.</p>
      <a class="btn" href="#about">시작하기</a>
    </section>

    <section id="about" class="cards">
      <div class="card">
        <h2>첫 번째 항목</h2>
        <p>설명을 입력하세요.</p>
      </div>
      <div class="card">
        <h2>두 번째 항목</h2>
        <p>설명을 입력하세요.</p>
      </div>
      <div class="card">
        <h2>세 번째 항목</h2>
        <p>설명을 입력하세요.</p>
      </div>
    </section>
  </main>

  <footer id="contact">
    &copy; <span id="year"></span> SASE World
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
